name: |
  (T) Pytest
permissions:
  contents: read
  pull-requests: write

on:
  push:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
        description: 'Python version used.'

jobs:
  pytest:
    runs-on:
      group: managed-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pipx install --python python${{ env.PYTHON_VERSION }} uv==0.11.31
      - name: Install dependencies using uv
        shell: bash
        run: uv sync --group dev --group docs --no-install-project --no-build --frozen
      - name: Show dependencies
        shell: bash
        run: uv tree --group dev --group docs --no-build --frozen
      - name: Unit tests
        if: ${{ hashFiles('tests/') != '' }}
        shell: bash
        run: PYTHONPATH=. uv run --no-sync --no-build pytest
      - name: Upload coverage.xml as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ hashFiles('coverage.xml') != '' }}
        with:
          name: coverage.xml
          path: ./coverage.xml
      - name: SonarQube Scan
        # dependabot cannot access these secrets (see 
        # https://github.com/dependabot/dependabot-core/issues/3253#issuecomment-852541544
        # for more info. We need this SonarQube scan for the coverage report,
        # so we still want it here for our own pushes.
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  #v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}