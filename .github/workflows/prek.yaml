name: |
  (CI) Prek
permissions:
  contents: read
  pull-requests: write

on:
  push:
    inputs:
      python-version:
        required: false
        default: '3.12'
        type: string
        description: 'Python version used.'


jobs:
  pre-commit:
    runs-on:
      group: managed-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version:  ${{ inputs.python-version }}
      - name: Install uv
        run: pipx install --python python${{ inputs.python-version }} uv==0.11.31
      - name: Install prek
        run: uv sync --group dev --no-install-project --no-build --frozen
      - name: Run prek
        shell: bash
        run: PYTHONPATH=. uv run --no-sync --no-build prek run -a
