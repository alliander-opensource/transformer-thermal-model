name: (CI) publish Package

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-to-pypi:
    name: Publish to PyPI
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on:
      group: managed-linux
    environment:
      name: pypi
      url: https://pypi.org/p/transformer-thermal-model
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check for release tag
        id: release_check
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release tag on HEAD, skipping publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.release_check.outputs.release == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.13

      - name: Install uv
        if: ${{ steps.release_check.outputs.release == 'true' }}
        run: pipx install --python python3.13 uv==0.11.31

      - name: Build package
        if: ${{ steps.release_check.outputs.release == 'true' }}
        run: uv build

      - name: Publish distribution to PyPI
        if: ${{ steps.release_check.outputs.release == 'true' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 #v1.14.3
